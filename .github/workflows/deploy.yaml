name: Build and Release Desktop App

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ["master"]

    workflow_dispatch:

# Each job asks for what it needs, only the release job can write to the repository
permissions:
    contents: read

# A push while a release runs waits, so the release is not cancelled half way
concurrency:
    group: "deploy-and-release"
    cancel-in-progress: false

jobs:
    # Deploy to pages first
    deploy-pages:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Setup Pages
              uses: actions/configure-pages@v6
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  # Upload dist folder
                  path: "./dist"
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

    version-check:
        name: Check version and generate release
        needs: deploy-pages
        runs-on: ubuntu-latest
        outputs:
            should_release: ${{ steps.version_check.outputs.should_release }}
            version: ${{ steps.version_check.outputs.version }}
        steps:
            - name: Checkout with full history
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check version
              id: version_check
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
                  echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

                  if [ -z "$LATEST_TAG" ]; then
                      echo "should_release=true" >> "$GITHUB_OUTPUT"
                  else
                      LATEST_VER=${LATEST_TAG#v}
                      if dpkg --compare-versions "$VERSION" gt "$LATEST_VER" 2>/dev/null; then
                          echo "should_release=true" >> "$GITHUB_OUTPUT"
                      else
                          echo "should_release=false" >> "$GITHUB_OUTPUT"
                      fi
                  fi

            - name: Generate patch notes (git commit list)
              if: steps.version_check.outputs.should_release == 'true'
              run: |
                  PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
                  if [ -n "$PREVIOUS_TAG" ]; then
                      RANGE="$PREVIOUS_TAG..HEAD"
                  else
                      RANGE="HEAD"
                  fi
                  # Version bumps ("1.4.13" or "1.4.13 (release)") are left out wherever they are
                  git log "$RANGE" --no-merges --format="%h %s" | while read -r HASH SUBJECT; do
                      if ! printf '%s\n' "$SUBJECT" | grep -qE '^v?[0-9]+(\.[0-9]+)+( \(release\))?$'; then
                          printf -- '- %s (`%s`)\n' "$SUBJECT" "$HASH"
                      fi
                  done > release_notes.md

            - name: Upload patch notes
              if: steps.version_check.outputs.should_release == 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: release-notes
                  path: release_notes.md
                  retention-days: 1

    # Build Desktop app
    build-electron:
        name: Build Electron (${{ matrix.os }})
        needs: version-check
        if: needs.version-check.outputs.should_release == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            # Builds the web app first, the desktop app is packaged from dist/
            - name: Build
              run: npm run app:dist
            - name: Check the packaged files
              if: matrix.os == 'ubuntu-latest'
              run: |
                  npx --no-install asar list dist/desktop/linux-unpacked/resources/app.asar > packaged_files.txt
                  grep -qx '/dist/index.html' packaged_files.txt
                  grep -qE '^/dist/assets/host_worker-.+\.js$' packaged_files.txt

            - name: Upload Linux artifacts
              if: matrix.os == 'ubuntu-latest'
              uses: actions/upload-artifact@v7
              with:
                  name: linux-artifacts
                  path: |
                      dist/desktop/*.AppImage
                      dist/desktop/*.deb
                      dist/desktop/*.blockmap
                      dist/desktop/latest*.yml
                  retention-days: 1

            - name: Upload Windows artifacts
              if: matrix.os == 'windows-latest'
              uses: actions/upload-artifact@v7
              with:
                  name: windows-artifacts
                  path: |
                      dist/desktop/*.exe
                      dist/desktop/*.blockmap
                      dist/desktop/latest*.yml
                  retention-days: 1

    publish-release:
        name: Publish GitHub release
        needs: [version-check, build-electron]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download notes
              uses: actions/download-artifact@v8
              with:
                  name: release-notes
                  path: .
            - name: Download Linux artifacts
              uses: actions/download-artifact@v8
              with:
                  name: linux-artifacts
                  path: artifacts
            - name: Download Windows artifacts
              uses: actions/download-artifact@v8
              with:
                  name: windows-artifacts
                  path: artifacts

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.version-check.outputs.version }}
                  body_path: release_notes.md
                  draft: false
                  prerelease: false
                  files: artifacts/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
