name: Setup
description: Install Node and the npm dependencies

runs:
    using: composite
    steps:
        - name: Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: .node-version
              cache: npm

        - name: Install dependencies
          shell: bash
          run: npm ci
