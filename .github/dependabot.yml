version: 2
updates:
    - package-ecosystem: "github-actions"
      # "/" only covers the workflows, the setup action has to be listed too
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: "monthly"
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns:
                  - "*"
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      # spessasynth_core is kept on "latest" on purpose (debug_scripts/npm_core.sh)
      ignore:
          - dependency-name: "spessasynth_core"
      groups:
          dev-dependencies:
              dependency-type: "development"
